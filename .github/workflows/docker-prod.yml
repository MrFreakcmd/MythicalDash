name: Docker Build & Publish (Production)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v1.0.0). Defaults to current commit."
        required: false
        type: string

jobs:
  build-backend:
    name: Build & Push Backend (Prod) - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-key: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            # Branch push
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ./backend/storage/packages
          key: ${{ runner.os }}-composer-${{ matrix.cache-key }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.cache-key }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        id: platform-tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/mrfreakcmd/mythicaldash_v3-backend:buildcache-${{ matrix.cache-key }}
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/mrfreakcmd/mythicaldash_v3-backend:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max
          tags: |
            ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-${{ steps.tags.outputs.version }}-${{ steps.platform-tag.outputs.tag }}

  manifest-backend:
    name: Create Multi-Arch Manifest - Backend
    runs-on: ubuntu-latest
    needs: build-backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            # Branch push
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for platform-specific images
        run: |
          echo "Waiting for platform-specific images to be available..."
          sleep 10

      - name: Create and push manifest
        run: |
          # Main manifest
          docker buildx imagetools create --tag ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-${{ steps.tags.outputs.version }} \
            ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-${{ steps.tags.outputs.version }}-linux-amd64 \
            ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-${{ steps.tags.outputs.version }}-linux-arm64

          # Latest tag (only for main branch)
          if [ "${{ steps.tags.outputs.latest }}" == "true" ]; then
            docker buildx imagetools create --tag ghcr.io/mrfreakcmd/mythicaldash_v3-backend:latest \
              ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-latest-linux-amd64 \
              ghcr.io/mrfreakcmd/mythicaldash_v3-backend:prod-latest-linux-arm64
          fi

  build-frontend:
    name: Build & Push Frontend (Prod) - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-key: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            # Branch push
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ matrix.cache-key }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.cache-key }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:buildcache-${{ matrix.cache-key }}
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:buildcache-${{ matrix.cache-key }},mode=max
            type=gha,mode=max
          tags: |
            ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:prod-${{ steps.tags.outputs.version }}
            ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:${{ steps.tags.outputs.version }}

  manifest-frontend:
    name: Create Multi-Arch Manifest - Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            # Branch push
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          # Main manifest
          docker buildx imagetools create --tag ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:prod-${{ steps.tags.outputs.version }} \
            ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:prod-${{ steps.tags.outputs.version }}

          docker buildx imagetools create --tag ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:${{ steps.tags.outputs.version }} \
            ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:${{ steps.tags.outputs.version }}

          # Latest tag (only for main branch)
          if [ "${{ steps.tags.outputs.latest }}" == "true" ]; then
            docker buildx imagetools create --tag ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:latest \
              ghcr.io/mrfreakcmd/mythicaldash_v3-frontend:prod-latest
          fi
